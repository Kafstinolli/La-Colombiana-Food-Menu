<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="La Colombiana Food menu: Colombian main dishes, soups, breakfast and drinks.">
    <title>La Colombiana Food - Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style-menu.css?v=20260726-2">
</head>
<body>
    <header class="menu-header">
        <button class="back-btn" type="button" onclick="window.location.href='index.html'" aria-label="Back to home">
            <svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
            </svg>
        </button>

        <a href="menu.html" aria-label="La Colombiana Food menu">
            <h1 class="menu-title-fixed">Menu</h1>
        </a>
    </header>

    <main class="menu-container">
        <section class="menu-section" aria-labelledby="main-dishes-title">
            <div class="section-heading">
                <p class="section-kicker">Authentic Colombian flavor</p>
                <h2 id="main-dishes-title">Main Dishes <span>(Platos Principales)</span></h2>
            </div>
            <div class="menu-items" data-menu-section="main"></div>
        </section>

        <section class="menu-section seasonal-section" aria-labelledby="soups-title">
            <div class="section-heading">
                <p class="section-kicker">Coming back after summer</p>
                <h2 id="soups-title">Soups <span>(Sopas)</span></h2>
                <p class="seasonal-notice">Unavailable during summer <span>(No disponibles en verano)</span></p>
            </div>
            <div class="menu-items" data-menu-section="soups"></div>
        </section>

        <section class="menu-section" aria-labelledby="breakfast-title">
            <div class="section-heading">
                <p class="section-kicker">Colombian morning favorites</p>
                <h2 id="breakfast-title">Breakfast <span>(Desayunos)</span></h2>
            </div>
            <div class="menu-items" data-menu-section="breakfast"></div>
        </section>

        <section class="menu-section" aria-labelledby="drinks-title">
            <div class="section-heading">
                <p class="section-kicker">Cold and refreshing</p>
                <h2 id="drinks-title">Drinks <span>(Bebidas)</span></h2>
            </div>
            <div class="menu-items" data-menu-section="drinks"></div>
        </section>
    </main>

    <div id="item-popup" class="popup" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="popup-dish" aria-describedby="popup-description">
        <div class="popup-content">
            <button class="popup-close" type="button" data-close-popup aria-label="Close details">×</button>
            <div id="popup-visual"></div>
            <p id="popup-featured" class="popup-featured" hidden>House Special</p>
            <p id="popup-seasonal" class="popup-seasonal" hidden>Unavailable during summer</p>
            <h2 class="dish" id="popup-dish"></h2>
            <p class="ingredients" id="popup-description"></p>
            <p class="price" id="popup-price"></p>
        </div>
    </div>

    <noscript>
        <p class="noscript-message">Please enable JavaScript to view the complete menu.</p>
    </noscript>
    <script src="script.js?v=20260726-2"></script>
</body>
</html>
